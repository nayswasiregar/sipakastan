<style>
:root{--bl:#075CAB;--bl2:#0A4A8A;--nv:#0A2E5C;--gd:#F5B800;--bg:#F2F5F9;--card:#fff;--ink:#17283C;--mut:#5B6B7E;--line:#D6DFEA;--soft:#E7EFF8;--ok:#1B7A49;--warn:#A86400;--bad:#B3261E;--inf:#075CAB;--br:var(--bl);--br2:var(--bl2);--gold:var(--gd);--side:#fff;--hd:72px;--hf:'Montserrat','Segoe UI',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(var(--hd) + env(safe-area-inset-top,0px));height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 'Open Sans','Segoe UI',Arial,sans-serif}
h1,h2,h3,h4,th,.btn,.sm,.mi,.b,.pill,label,.hd b{font-family:var(--hf)}h1,h2,h3,h4{margin:0;color:var(--nv)}.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
span:empty{display:none}
.hd{position:sticky;top:0;z-index:40;height:var(--hd);background:#fff;display:flex;align-items:center;gap:16px;padding:0 24px;box-shadow:0 2px 12px rgba(10,46,92,.1)}
.brandk{display:flex;gap:12px;align-items:center}.brandk b{display:block;font-weight:800;font-size:15px;color:var(--nv);line-height:1.15}.brandk small{display:block;font:600 10.5px var(--hf);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ib{background:#fff;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer;position:relative;color:var(--nv);display:grid;place-items:center}.ib:hover{background:var(--soft)}
.bdg{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font:700 10px var(--hf);border-radius:10px;padding:1px 6px;font-style:normal}
.srch{flex:1;max-width:440px;margin-left:auto;display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--mut)}.srch input{border:0;background:transparent;flex:1;font:inherit;color:var(--ink);outline:0;min-width:0}
.rel{position:relative}.dd{display:none;position:absolute;right:0;top:50px;width:320px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(10,46,92,.18);padding:10px;z-index:60}.dd.show{display:block}.dd div{display:block;padding:8px 10px;border-radius:8px}.dd div:hover{background:var(--soft)}
.um{display:flex;gap:10px;align-items:center;cursor:pointer}.um b{display:block;font-size:13px;color:var(--nv)}.um small{display:block;color:var(--mut);font-size:11px}.av{width:38px;height:38px;border-radius:50%;background:var(--bl);display:grid;place-items:center;font:800 15px var(--hf);color:#fff}

.side{width:270px;background:#fff;border-right:1px solid var(--line);padding:18px 12px 40px;position:sticky;top:var(--hd);height:calc(100vh - var(--hd));overflow:auto;flex-shrink:0}

.main{flex:1;min-width:0}.content{padding:24px 32px 64px;max-width:1320px}.crumb{font-size:12.5px;color:var(--mut);margin-bottom:6px}.crumb b{color:var(--nv)}

.chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12.5px;font-family:inherit;color:var(--ink)}

.btn{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer}.btn:hover{background:var(--bl2)}.btn.g{background:#fff;color:var(--bl);border:1.5px solid var(--bl)}.btn.g:hover{background:var(--soft)}.btn.d{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar .in:first-child{flex:1;min-width:180px}

.b{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}.b.ok{background:#E1F3E8;color:var(--ok)}.b.bad{background:#FBE5E3;color:var(--bad)}.b.warn{background:#FFF1D1;color:#8A5300}.b.gr{background:#ECEFF3;color:var(--mut)}.b.inf{background:#E1ECF9;color:var(--bl)}

.note{background:#EEF4FB;border-left:4px solid var(--gd);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:13px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs .sm.on{background:var(--bl);color:#fff}
.pill{background:#E1F3E8;color:var(--ok);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}.pill.bad{background:#FBE5E3;color:var(--bad)}.ey{font:700 11.5px var(--hf);color:var(--bl)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips .sm.on{background:var(--bl);color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}.bcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:box-shadow .2s}.bcard:hover{box-shadow:0 12px 26px rgba(10,46,92,.16)}
.cvw{background:#E9EFF6;border-radius:10px;padding:16px 20px}.cvi{position:relative;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:3px 6px 14px rgba(10,30,60,.38);background:#fff}.cvi img{width:100%;height:100%;object-fit:cover;display:block}.cvi::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.18) 4%,rgba(0,0,0,0) 10%)}
.cv{width:100%;height:100%;padding:16px 14px 16px 20px;display:flex;flex-direction:column;justify-content:space-between}.cv b{font:800 16px/1.2 var(--hf)}.cv span{font-size:11px;opacity:.85}
.bcard h4{margin:6px 0 2px;font-size:14.5px;line-height:1.3}.bf{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.dt{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}.meter{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0 6px}.meter i{display:block}.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.ex{display:inline-flex;flex-direction:column;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:3px;font-weight:700}.ex small{font-size:10px;font-weight:500;color:var(--mut)}.ex.cl{cursor:pointer}.ex.cl:hover{background:var(--bl);color:#fff}.ex.cl:hover small{color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}.rcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.rcard svg{display:block;width:100%;background:var(--soft)}.rb{padding:18px}.rb h3{margin:6px 0}.ra{display:flex;gap:8px;margin-top:14px}.rbtn{flex:1;background:#fff;color:var(--bl);border:1.5px solid var(--bl)}.rbtn:hover{background:var(--bl);color:#fff}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}.slot{padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font:600 13px var(--hf);text-align:center}.slot:hover:not(:disabled){border-color:var(--bl)}.slot.sel{background:var(--bl);color:#fff}.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.ico{display:none}.dgrid .card{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:700;font-family:var(--hf);color:var(--nv)}details li,details p{color:var(--mut)}
.idwrap{display:flex;justify-content:center;padding:6px}.idc{width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 22px rgba(10,46,92,.18);font-family:'Open Sans',Arial,sans-serif;color:#17283C;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left}
.idh{background:var(--bl);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:4px solid var(--gd)}.idh b{display:block;font:800 12px var(--hf)}.idh small{display:block;font-size:9.5px;color:#CFE2F6}
.idb{display:flex;gap:12px;padding:14px 14px 6px}.idp{width:64px;height:80px;border-radius:8px;background:var(--soft);color:var(--bl);display:grid;place-items:center;font:800 28px var(--hf);flex-shrink:0}.idt b{display:block;font:700 14px var(--hf);color:var(--nv);margin-bottom:2px}.idt span{display:block;font-size:11.5px;color:#3B4C60}.idf{padding:0 14px 10px}.idf small{display:block;font-size:10px;color:var(--mut)}
.lgn{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.lgl{background:var(--bl);color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}.lgl h1{color:#fff;font-size:50px;line-height:1.1;font-weight:800;margin:0 0 14px}.lgl p{color:#D9E8F8;max-width:460px;font-size:16px;margin:0}
.lgi{display:grid;gap:12px;margin-top:28px;max-width:460px}.lgi div{background:var(--bl2);border-radius:16px;padding:16px 18px}.lgi b{display:flex;gap:8px;align-items:center;font:700 14px var(--hf)}.lgi b::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--gd)}.lgi span{display:block;color:#D9E8F8;font-size:13px;margin-top:3px}
.lgr{background:#fff;display:grid;place-items:center;padding:28px}.lgr form{width:min(400px,100%)}.lgr h2{font-size:26px;margin-bottom:6px}.lgr label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 5px}.lgr .in{width:100%;padding:12px 14px}.pw{position:relative}.pw .sm{position:absolute;right:8px;top:8px}
.lgb{width:100%;margin-top:20px;padding:13px}.err{background:#FBE5E3;color:var(--bad);border-radius:8px;padding:9px 12px;margin-top:12px;font-weight:600}.dm{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}.dm small{color:var(--mut)}.chipb{background:#fff;color:var(--bl);border:1px solid var(--bl);border-radius:20px;padding:5px 14px;margin:6px 6px 0 0;cursor:pointer;font:600 12px var(--hf)}.chipb:hover{background:var(--bl);color:#fff}
.pg{animation:fi .3s ease}@keyframes fi{from{opacity:0}to{opacity:1}}
@media(max-width:860px){.app{flex-direction:column}.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.content{padding:18px}.hd{padding:0 14px}.brandk small,.srch{display:none}.hero{grid-template-columns:1fr;padding:28px}.hero h2{font-size:30px}.lgn{grid-template-columns:1fr}.lgl{padding:28px}.lgl h1{font-size:36px}}
@media(prefers-reduced-motion:reduce){.pg{animation:none}}

const quota={Mahasiswa:3,Pegawai:3,Dosen:5},DAY=864e5;
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const plus=n=>ymd(new Date(Date.now()+n*DAY));
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const dt=s=>s?new Date(s).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';

async function sha(s){const t='sipaka$'+s;if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return'h'+h}
function tbl(h,r){return`<div class=tw><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${h.length} class=mut>Tidak ada data</td></tr>`}</tbody></table></div>`}

TB.ang=tAng;function tAng(){const q=(Q.ang||'').toLowerCase(),p=U.role=='ptg';return tbl(['ID (NIM/NIP)','Nama','Kategori','Prodi/Unit','Kontak','Tgl daftar','Status','Aksi'],S.ang.filter(a=>(!Q.as||a.status==Q.as)&&(a.id+a.nama+a.unit).toLowerCase().includes(q)).map(a=>[a.id,esc(a.nama),a.kat,esc(a.unit),a.hp+'<br>'+esc(a.email),dd(a.tgl),B(a.status)+(a.akhir?' <span class="b warn">Akademik berakhir</span>':'')+(a.sanksi&&a.sanksi>=ymd()?' <span class="b bad">Sanksi no-show</span>':''),`<button class=sm onclick="det('${a.id}')">Detail</button>`+(p?` <button class=sm onclick="fEd('${a.id}')">Ubah</button><button class=sm onclick="kartu('${a.id}')">Kartu</button>${a.status!='Nonaktif'&&!a.akhir?`<button class=sm onclick="fAkh('${a.id}')">Catat status akademik</button>`:''}${a.status=='Nonaktif'?`<button class=sm onclick="fReak('${a.id}')">Reaktivasi</button>`:''}<button class=sm onclick="fIdk('${a.id}')">Ubah ID/kategori*</button><button class=sm onclick="reqO('Penghapusan data anggota','${a.id}',null)">Hapus*</button>`:'')]))}

function fAng(){if(!gate('ptg'))return;modal('Pendaftaran Anggota Baru',`<div class=f>${fld('ID Anggota (NIM 10 digit / NIP 18 digit)*','n_id','','inputmode=numeric maxlength=18')}${fld('Nama lengkap*','n_nm')}<div><label>Kategori*</label><select id=n_kt><option>Mahasiswa</option><option>Dosen</option><option>Pegawai</option></select></div>${fld('Prodi / Unit kerja*','n_un')}${fld('Nomor HP*','n_hp')}${fld('Email*','n_em')}</div><p><label><input type=checkbox id=n_ck> Identitas (KTM / kartu pegawai) telah diperiksa (BR-ANG-01)</label></p><div class=note>Tanggal daftar otomatis dari jam sistem. Status awal <b>Aktif</b>. Akun login dibuat otomatis (kata sandi awal = ID anggota).</div>`,()=>{
 const id=v('n_id').trim(),kt=v('n_kt'),f=[id,v('n_nm'),v('n_un'),v('n_hp'),v('n_em')];if(f.some(x=>!x.trim()))return'Semua data wajib diisi (BR-ANG-02)';if(!$('#n_ck').checked)return'Identitas wajib diperiksa (BR-ANG-01)';

 S.ang.push({id,nama:v('n_nm').trim(),kat:kt,unit:v('n_un').trim(),hp:v('n_hp'),email:v('n_em').trim(),tgl:ymd(),status:'Aktif',akhir:false,ns:[]});sha(id).then(h=>{S.users.push({user:id,email:v('n_em'),nama:v('n_nm'),role:'ang',h,fail:0,lock:0,on:true});save()});lg('Tambah anggota',id,'-',v('n_nm'));setTimeout(()=>{addCetak(id,'Cetak pertama (pendaftaran)','Petugas');kartu(id)},200)},'Daftarkan')}
function fEd(id){const a=AG(id);modal('Ubah Data Anggota',`<div class=f><div><label>ID / Kategori (tidak dapat diubah langsung)</label><div class=in>${a.id} · ${a.kat}</div></div>${fld('Prodi / Unit','e_un',a.unit)}${fld('Nomor HP','e_hp',a.hp)}${fld('Email','e_em',a.email)}</div>`,()=>{if(!/^\d{8,15}$/.test(v('e_hp')))return'Nomor HP tidak valid';const o=JSON.stringify([a.unit,a.hp,a.email]);a.unit=v('e_un');a.hp=v('e_hp');a.email=v('e_em');lg('Ubah data anggota',a.id,o,JSON.stringify([a.unit,a.hp,a.email]))})}

function fReak(id){const a=AG(id);modal('Reaktivasi Anggota (T6)',`<div class=f>${fld('Bukti valid (selesai cuti/koreksi data/perpanjangan tugas)*','r_b')}<div><label>Masa berlaku baru*</label><input type=date class=in id=r_d></div></div>`,()=>{if(!v('r_b').trim()||!v('r_d')||v('r_d')<=ymd())return'Bukti dan masa berlaku baru (setelah hari ini) wajib';a.akhir=false;a.berlaku=v('r_d');a.status='Aktif';lg('Reaktivasi anggota (Petugas)',a.id,'Nonaktif','Aktif; '+v('r_b'));sync(a)})}

function bkD(k){const b=BK(k),p=U.role=='ptg';modal(`${b.kode} — ${esc(b.judul)}`,tbl(['Kode eksemplar','Status',p?'Ubah status (alasan wajib)':''],S.ek.filter(e=>e.bk==k).map(e=>[e.kode,B(e.st),p&&['Tersedia','Rusak','Referensi'].includes(e.st)?`<button class=sm onclick="stE('${e.kode}')">Ubah</button>`:p?'<span class=mut>Diatur lewat transaksi/otorisasi</span>':'']))+(p?`<p><button class=btn onclick="addE('${k}')">+ Eksemplar</button></p>`:''))}
function addE(k){if(!gate('ptg'))return;const n=S.ek.filter(e=>e.bk==k).length+1,kode=k+'-'+String(n).padStart(2,'0');S.ek.push({kode,bk:k,st:'Tersedia'});lg('Tambah eksemplar',kode,'-','Tersedia');cm();render();bkD(k)}
function stE(k){const e=EK(k);modal('Ubah Status '+k,`<div class=f><div><label>Status baru</label><select id=se>${['Tersedia','Rusak','Referensi'].map(s=>`<option ${s==e.st?'disabled':''}>${s}</option>`).join('')}</select></div>${fld('Alasan*','sa')}</div>`,()=>{if(!v('sa').trim())return'Alasan wajib (BR-BUK-09)';const o=e.st;e.st=v('se');lg('Ubah status eksemplar manual',k,o,e.st+' — '+v('sa'))})}
function fBk(){modal('Tambah Judul Buku',`<div class=f>${fld('Judul*','b1')}${fld('Pengarang*','b2')}${fld('Penerbit*','b3')}${fld('Tahun terbit*','b4')}${fld('ISBN*','b5')}${fld('Kategori*','b6')}${fld('Harga (Rp, >0)*','b7','','type=number')}${fld('Lokasi rak*','b8')}${fld('Jumlah eksemplar awal','b9','1','type=number')}</div>`,()=>{if(['b1','b2','b3','b4','b5','b6','b8'].some(i=>!v(i).trim()))return'Semua data judul wajib diisi (BR-BUK-02)';if(!(+v('b7')>0))return'Harga harus lebih besar dari nol (BR-BUK-03)';const n=Math.max(1,+v('b9')||1),kode='BK-'+String(S.bk.length+1).padStart(4,'0');S.bk.push({kode,judul:v('b1'),pengarang:v('b2'),penerbit:v('b3'),tahun:v('b4'),isbn:v('b5'),kat:v('b6'),harga:+v('b7'),rak:v('b8')});for(let i=1;i<=n;i++)S.ek.push({kode:kode+'-'+String(i).padStart(2,'0'),bk:kode,st:'Tersedia'});lg('Tambah judul buku',kode,'-',v('b1')+' ('+n+' eks.)')})}
function fOp(){const e=S.ek.filter(x=>x.st=='Tersedia');modal('Stock Opname (minimal 1× setahun, BR-BUK-12)',`<div class=note>Hapus centang eksemplar yang <b>tidak ditemukan</b> di rak. Selisih diajukan ke Kepala untuk penetapan Hilang.</div><div style="max-height:300px;overflow:auto;columns:2">${e.map(x=>`<label style="display:block"><input type=checkbox class=op value="${x.kode}" checked> ${x.kode}</label>`).join('')}</div>`,()=>{const miss=[...document.querySelectorAll('.op')].filter(c=>!c.checked).map(c=>c.value);S.opname.push({t:new Date().toISOString(),pt:U.user,tot:e.length,sel:miss});lg('Stock opname',String(e.length)+' eks.','-','Selisih: '+(miss.join(', ')||'0'));miss.forEach(k=>S.otr.push({id:'OTR-'+(S.otr.length+1),jenis:'Penetapan hilang (opname)',ref:k,data:null,alasan:'Selisih stock opname '+ymd(),pm:U.user,t:new Date().toISOString(),st:'Menunggu'}));toast(miss.length?miss.length+' selisih diajukan ke Kepala':'Opname sesuai')},'Selesaikan Opname')}
/* ===== sirkulasi ===== */
function pSirk(){const a=AG(cart.a),av=S.ek.filter(e=>e.st=='Tersedia');return`<div class=two><div class=card><h3>Peminjaman Buku</h3><div class=f>${fld('ID Anggota (scan kartu)*','pa',cart.a)}<div><label>Eksemplar tersedia</label><select id=pe>${av.map(e=>`<option value="${e.kode}">${e.kode} — ${esc(BK(e.bk).judul)}</option>`).join('')}</select></div>${fld('atau scan kode eksemplar','pk','','placeholder="BK-0001-01"')}</div><div class=bar style="margin-top:10px"><button class=btn onclick=addCart()>Tambah ke daftar</button></div>
${a?`<div class=note><b>${esc(a.nama)}</b> · ${a.kat} · ${B(a.status)} · pinjaman ${pjmA(a.id).length}/${quota[a.kat]} · tunggakan ${rp(tunggakanRp(a.id))}</div>`:''}
${cart.items.length?tbl(['Eksemplar','Judul',''],cart.items.map((k,i)=>[k,esc(BK(EK(k).bk).judul),`<button class=sm onclick="cart.items.splice(${i},1);render()">Hapus</button>`]))+`<p>Jatuh tempo: <b>${dd(addSvc(ymd(),14))}</b> (14 hari layanan)</p><button class=btn onclick=prosesPjm()>Proses Peminjaman & Cetak Bukti</button>`:'<p class=mut>Belum ada buku dalam daftar.</p>'}
<div class=note>Aturan: anggota Aktif · tanpa denda/ganti rugi · tanpa pinjaman terlambat · kuota (Mhs 3, Pegawai 3, Dosen 5) · eksemplar Tersedia (bukan Referensi) · tidak boleh judul sama.</div></div>
<div class=card><h3>Transaksi terbaru</h3>${tbl(['No','Anggota','Eksemplar','Status',''],S.pjm.slice(-8).reverse().map(p=>[p.no,p.a,p.eks,B(p.st),`<button class=sm onclick="bukti('${p.no}')">Bukti</button>${p.st!='Dibatalkan'?`<button class=sm onclick="reqO('Pembatalan transaksi','${p.id}',null)">Ajukan batal*</button>`:''}`]))}<p class=mut style="font-size:12px">* memerlukan persetujuan Kepala + alasan tertulis (BR-UM-18, 21). Data transaksi tidak pernah dihapus.</p></div></div>
<h3 style="margin:18px 0 10px">Pengembalian, Perpanjangan & Penetapan Hilang</h3><div class=bar><input class=in placeholder="Cari ID anggota / kode eksemplar / no. PJM…" oninput="Q.s=this.value;rt()" value="${esc(Q.s||'')}"></div><div id=tb>${tSirk()}</div>`}
TB.sirk=tSirk;function tSirk(){const q=(Q.s||'').toLowerCase(),t=ymd();return tbl(['No. Peminjaman','Anggota','Buku / Eksemplar','Pinjam','Jatuh tempo','Kondisi','Aksi'],S.pjm.filter(p=>p.st=='Dipinjam'&&(p.a+p.eks+p.no).toLowerCase().includes(q)).map(p=>{const h=lateD(p.jt),a=AG(p.a);return[p.no,p.a+'<br>'+esc(a.nama),esc(BK(EK(p.eks).bk).judul)+'<br>'+p.eks,dd(p.t),dd(p.jt)+(p.perp?`<br><span class=mut>diperpanjang ${p.perp}×</span>`:''),h>0?`${B('Terlambat')} ${h} hari · denda ${rp(accr(p))}`:p.jt<=plus(2)?'<span class="b warn"> jatuh tempo ≤ 2 hari</span>':'<span class="b ok">Normal</span>',`<button class=sm onclick="ret(${p.id})">Kembalikan</button><button class=sm onclick="perp(${p.id})">Perpanjang</button><button class=sm onclick="hil(${p.id},'lapor')">Lapor hilang</button>${h>30?`<button class=sm style="color:var(--bad)" onclick="hil(${p.id},'tetap')">Tetapkan Hilang</button>`:''}`]}))}
function addCart(){if(!gate('ptg'))return;const a=AG(v('pa').trim()),k=v('pk').trim().toUpperCase()||v('pe');cart.a=v('pa').trim();const e=buka()||canP(a,k,cart.items);if(e)return toast(e,1),render();cart.items.push(k);render()}
function canP(a,k,c){const e=EK(k);if(!a)return'Anggota tidak ditemukan';if(a.status!='Aktif')return`Status anggota ${a.status}: tidak dapat meminjam (BR-PJM-02)`;if(a.akhir)return'Status akademik/kepegawaian berakhir: tidak dapat meminjam baru (BR-UM-36)';if(tung(a.id))return'Masih ada denda/ganti rugi belum selesai (BR-PJM-03)';if(pjmA(a.id).some(p=>p.jt<ymd()))return'Ada pinjaman melewati jatuh tempo (BR-PJM-04)';if(!e)return'Kode eksemplar tidak ditemukan';if(e.st=='Referensi')return'Eksemplar Referensi hanya baca di tempat (BR-BUK-11)';if(e.st!='Tersedia')return`Eksemplar berstatus ${e.st} (BR-PJM-06)`;if(c.includes(k))return'Sudah ada di daftar';if(pjmA(a.id).length+c.length>=quota[a.kat])return`Kuota ${a.kat} ${quota[a.kat]} buku tercapai (BR-PJM-05)`;if(pjmA(a.id).some(p=>EK(p.eks).bk==e.bk)||c.some(x=>EK(x).bk==e.bk))return'Judul yang sama sedang dipinjam anggota (BR-PJM-07)';return''}
function prosesPjm(){if(!gate('ptg'))return;const e=buka();if(e)return toast(e,1);const a=AG(cart.a),no=nom('PJM',S.pjm);for(const k of cart.items){const m=canP(a,k,[]);if(m)return toast(m,1),render();S.pjm.push({id:S.pjm.length+1,no,a:a.id,eks:k,t:new Date().toISOString(),jt:addSvc(ymd(),14),perp:0,st:'Dipinjam',pt:U.user});EK(k).st='Dipinjam';lg('Peminjaman buku',no+' '+k,'Tersedia','Dipinjam oleh '+a.id)}cart={a:'',items:[]};render();bukti(no)}
function bukti(no){const L=S.pjm.filter(p=>p.no==no);if(!L.length)return;const a=AG(L[0].a);printDoc(`<h3>BUKTI PEMINJAMAN BUKU<br>Perpustakaan PKN STAN</h3><p>No. Transaksi: <b>${no}</b><br>Tanggal: ${dt(L[0].t)}<br>Anggota: ${a.id} — ${esc(a.nama)} (${a.kat})<br>Petugas: ${L[0].pt}</p><table style="width:100%;border:1px solid #000"><tr><th>Eksemplar</th><th>Judul</th><th>Jatuh tempo</th></tr>${L.map(p=>`<tr><td>${p.eks}</td><td>${esc(BK(EK(p.eks).bk).judul)}</td><td>${dd(p.jt)}</td></tr>`).join('')}</table><p style="font-size:12px">Denda keterlambatan Rp1.000/hari/buku (maks. harga buku). Notifikasi pengingat H-2 dikirim ke email anggota.</p>`)}
function ret(id){if(!gate('ptg'))return;const p=S.pjm.find(x=>x.id==id),e=EK(p.eks),b=BK(e.bk),h=lateD(p.jt),j=h>0?Math.min(1000*h,b.harga):0;
 modal('Pengembalian '+p.eks,`<p>${esc(b.judul)} · ${p.a}</p><div class=f><div><label>Kondisi buku (BR-PJM-09)</label><select id=kd><option>Baik</option><option>Rusak</option></select></div>${fld('Catatan (wajib jika rusak)','kc')}</div>${j?`<div class=note>Terlambat <b>${h}</b> hari → denda <b>${rp(j)}</b> (Rp1.000 × hari, maks. harga buku). Dibayar saat pengembalian (BR-PJM-13).</div><div class=f><div><label>Pembayaran</label><select id=by><option value=1>Bayar tunai sekarang</option><option value=0>Belum dibayar (anggota diblokir)</option></select></div>${fld('Nominal tunai (harus sama)','nm','','type=number')}${fld('No. referensi pembayaran','rf')}</div>`:''}`,()=>{const e1=buka();if(e1)return e1;const kd=v('kd'),by=v('by')=='1';if(kd=='Rusak'&&!v('kc').trim())return'Catatan wajib untuk buku rusak';if(j&&by){if(+v('nm')!=j)return`Nominal harus tepat ${rp(j)} (BR-GRG-07)`;if(!v('rf').trim())return'No. referensi wajib'}
 p.st='Dikembalikan';p.kembali=new Date().toISOString();p.kond=kd;p.pr=U.user;e.st=kd=='Rusak'?'Rusak':'Tersedia';lg('Pengembalian buku',p.no+' '+p.eks,'Dipinjam',e.st+(v('kc')?' — '+v('kc'):''));if(j){const d=mkDnd(p);p.denda=d.id;if(by){const y=payD(d,v('rf'));toast('Denda lunas: '+y.no)}}chk()},'Proses')}

function pRsv(){const a=U.role=='ang',H=[...Array(14)].map((_,i)=>i+8);return`${a?`<div class=card style="margin-bottom:16px"><h3>Pesan Ruangan</h3><div class=f><div><label>Ruangan</label><select id=rr>${rgVis().map(r=>`<option value=${r.k} ${r.st!='Tersedia'?'disabled':''}>${r.n} (${r.min}–${r.max} org)${r.st!='Tersedia'?' — Perbaikan':''}</option>`).join('')}</select></div><div><label>Tanggal (H-1 s.d. hari ini)</label><select id=rd><option value=${ymd()}>Hari ini ${dd(ymd())}</option><option value=${plus(1)}>Besok ${dd(plus(1))}</option></select></div><div><label>Jam mulai</label><select id=rm>${H.map(h=>`<option value=${h}>${String(h).padStart(2,'0')}.00</option>`).join('')}</select></div><div><label>Durasi</label><select id=ru><option value=1>1 jam</option><option value=2>2 jam</option></select></div>${fld('Jumlah peserta','rp','2','type=number')}</div><p><button class=btn onclick=doBook()>Pesan</button></p><div class=note>Jam 08.00–17.00 (sesi malam 17.00–21.30 saat periode ujian${S.cfg.ujian?' — <b>sedang aktif</b>':''}, first come first serve). Maks. 2 jam, 1 pemesanan aktif/hari. Batal paling lambat 30 menit sebelum mulai. Dilarang membawa makanan/minuman ke ruang diskusi dan wajib menjaga kebersihan (BR-RNG-16). 5× no-show per semester = sanksi 14 hari.</div></div>`:''}
<div class=tw style="margin-bottom:16px">${tbl(['Kode','Ruangan','Jenis','Kapasitas','Fasilitas','Status',U.role=='ptg'?'Aksi':''],S.rg.map(r=>[r.k,r.n,r.j,r.min+'–'+r.max,r.f,B(r.st),U.role=='ptg'?`<button class=sm onclick="togR('${r.k}')">Set ${r.st=='Tersedia'?'Perbaikan':'Tersedia'}</button>`:'']))}</div><h3 style="margin-bottom:8px">${a?'Reservasi Saya':'Seluruh Reservasi'}</h3><div id=tb>${tRsv()}</div>`}
TB.rsv=tRsv;function tRsv(){return tbl(['No. reservasi','Anggota','Ruangan','Tanggal','Jam','Peserta','Status','Aksi'],S.rsv.filter(r=>U.role!='ang'||r.a==U.user).slice().reverse().map(r=>[r.no,r.a+(U.role!='ang'?'<br>'+esc(AG(r.a)?AG(r.a).nama:''):''),S.rg.find(x=>x.k==r.r).n,dd(r.tgl),`${String(r.mulai).padStart(2,'0')}.00–${String(r.mulai+r.dur).padStart(2,'0')}.00`,r.p,B(r.st),`<button class=sm onclick="rBukti('${r.no}')">Bukti</button>`+(r.st=='Dipesan'&&U.role=='ang'?`<button class=sm onclick="cancelR('${r.no}')">Batalkan</button>`:'')+(r.st=='Dipesan'&&U.role=='ptg'?`<button class=sm onclick="chkin('${r.no}')">Check-in & serahkan kunci</button>`:'')+(r.st=='Check-in'&&U.role=='ptg'?`<button class=sm onclick="kembK('${r.no}')">Kunci kembali</button>`:'')]))}

function pPand(){const G=[[' Keanggotaan & status','<ul><li>Kategori: Mahasiswa, Dosen, Pegawai. Status: <b>Aktif</b> (semua layanan), <b>Blokir</b> (ada denda/ganti rugi — tidak bisa pinjam/pesan, tetap bisa melunasi), <b>Nonaktif</b> (lulus/cuti/pensiun dll. — hanya lihat katalog & riwayat).</li><li>Status Blokir kembali Aktif otomatis setelah kewajiban selesai atau dibebaskan Kepala (BR-UM-05).</li></ul>'],[' Peminjaman buku','<ul><li>Hanya dilayani secara offline, langsung di Ruang Sirkulasi Lantai 1 Perpustakaan oleh Petugas dengan membawa kartu anggota; tidak ada peminjaman online. Kuota: Mahasiswa 3, Pegawai 3, Dosen 5 buku. Lama pinjam 14 hari layanan.</li><li>Tidak boleh meminjam judul yang sama bersamaan; buku Referensi hanya dibaca di tempat.</li></ul>'],[' Pengembalian, perpanjangan & denda','<ul><li>Denda Rp1.000 × hari terlambat × buku (maksimal harga buku), dibayar saat pengembalian.</li><li>Perpanjangan maksimal 3 kali; ditolak jika terlambat, ada denda, atau status bukan Aktif.</li><li>Terlambat lebih dari 30 hari dapat ditetapkan Hilang.</li></ul>'],[' Kehilangan buku','<ul><li>Pilih buku pengganti (judul & jenis sama, disetujui Kepala) atau bayar sebesar harga buku secara tunai sekaligus.</li><li>Batas penyelesaian 30 hari; terlewat = tetap Blokir dan tidak dapat SKBP.</li></ul>'],[' Reservasi ruangan','<ul><li>Pesan H-1 s.d. 30 menit sebelum mulai, jam 08.00–17.00, maks. 2 jam, 1 pemesanan aktif/hari.</li><li>Check-in maks. 15 menit setelah mulai; batal paling lambat 30 menit sebelumnya. 5× no-show per semester = sanksi 14 hari.</li></ul>'],['Cetak kartu anggota online','<ul><li>Anggota Aktif dan Blokir dapat mencetak kartu sendiri melalui menu Cetak Kartu Anggota.</li><li>Cetak ulang karena kartu hilang wajib disertai surat pernyataan anggota (BR-ANG-10).</li></ul>'],[' Jam operasional','<p>Senin–Jumat 08.00–21.30 WIB · Sabtu–Minggu 08.00–17.00 WIB · hari libur nasional/kampus tidak ada layanan.</p>'],[' Keamanan & akun','<ul><li>Gunakan akun pribadi. Akun terkunci sementara setelah 5× salah masuk; sesi berakhir setelah 15 menit tidak aktif.</li><li>Data pribadi dikelola sesuai UU 27/2022 dan tidak diekspor tanpa izin Kepala.</li></ul>']];return G.map((g,i)=>`<details ${i?'':'open'}><summary>${g[0]}</summary>${g[1]}</details>`).join('')}
